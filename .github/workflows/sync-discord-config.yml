name: Sync Discord mod config

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes; adjust as you like
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab
  repository_dispatch:
    types: [dependency_update]
  
permissions:
  contents: write   # needed to commit the updated mods.json back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch Discord config and write mods.json
        # Channels to read are set in the CHANNELS list inside
        # sync_discord_config.py. DISCORD_CHANNEL_ID is only used as a
        # fallback if you leave CHANNELS empty in the script.
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python sync_discord_config.py

      - name: Commit mods.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mods.json
          git diff --cached --quiet || git commit -m "Sync mods.json from Discord"
          git push
